// App-writable device settings.

syntax = "proto3";

package snapshotpb.v1;

import "snapshotpb/v1/language.proto";

// The part of the display the marker's grip frame actually reveals.
//
// The board's screen sits behind a grip frame, and the frame variant a marker is
// built into hides a different part of it — in both axes. The board drives the
// whole panel either way, so anything laid out over the hidden part is simply not
// visible to the user. This rectangle tells the board where to lay its UI out.
//
// It is a RECTANGLE rather than a choice from a list on purpose: grip frames the
// board firmware has never heard of have to work, so a client describes the cutout
// it measured instead of naming one the board already knows.
//
// COORDINATES are the panel's own, in pixels, origin at its 0,0. Mind the 90°
// mount: the panel is 128 wide by 32 tall in ITS frame, but is fitted turned, so
// `w` is how much of the user's VERTICAL run is revealed and `h` how much of the
// horizontal WIDTH. Measure on the glass, then map through that rotation once.
//
// BOUNDS, enforced by the board — a write outside them is rejected whole:
//   x + w <= 128, y + h <= 32     (a window is part of the panel)
//   w >= 70, h >= 26              (below this the UI stops being readable; the
//                                  four-digit shot counter alone needs 64 x 16)
//
// A word of care: the board cannot tell whether the rectangle you send matches the
// frame actually fitted, so a legal rectangle in the wrong PLACE shows the user
// nothing at all — and the on-screen menu is one of the ways they would fix it.
// Offer a way back to the whole panel (Setup > Full window does this on the board).
message DisplayWindow {
  // Top-left corner, offset from the panel's 0,0.
  uint32 x = 1;
  uint32 y = 2;

  // Extent. `w` runs along the panel's long axis (the user's vertical).
  uint32 w = 3;
  uint32 h = 4;
}

// App-writable device settings — the message clients send to configure the
// board. Board-owned, read-only fields (device_id, lockout_enabled,
// supported_profile_count) live on Device instead, so a client write cannot
// alter them.
message DeviceConfig {
  // 1-based index of the profile to activate, in [1, Device.supported_profile_count];
  // 0 means unset. Stored as a uint8 in firmware (see device_config.options).
  uint32 active_profile = 1;

  // Text the board shows for a moment when it is turned on. It defaults to
  // SnapshotPB. The limit is 10 BYTES, not 10 characters: UTF-8 spends more than
  // one byte on a character outside ASCII, so an accented letter costs two.
  //
  // This is the user's own text, so DeviceConfig.language does not constrain it.
  // The board's font pack decides which characters the board can draw, and the
  // client limits the user's input to the characters that pack holds. A character
  // the font pack lacks does not draw.
  string boot_text = 2;

  // The grip frame cutout the board lays its UI out inside. OMIT IT to leave the
  // board's current window alone — a message field has explicit presence, so a
  // client that writes only boot_text cannot move the window by omission, and
  // there is no "zero rectangle" that could be confused with not having said.
  // A board that has never been given one uses the whole panel.
  DisplayWindow display_window = 3;

  // The language the board draws ITS OWN menu text in. It does not constrain
  // boot_text above, or Profile.name, which stay the user's own text -- see
  // language.proto. OMIT IT, or send LANGUAGE_UNSPECIFIED, to leave the board's
  // current language alone.
  //
  // The board applies a language it draws, and IGNORES a value it does not know:
  // it keeps its current language and applies the rest of the message. This is
  // deliberately unlike display_window, which rejects the whole message when the
  // rectangle is out of bounds. A rectangle in the wrong place shows the user
  // nothing, so a bad one must not reach the board. A language a board is too old
  // to draw means only that the client knows more than the board, and the other
  // fields in the message are still good. So a client must not assume a write took
  // effect. Read the DeviceConfig back to see which language the board holds.
  Language language = 4;
}

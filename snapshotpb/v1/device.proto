// Protocol definition for device data 

syntax = "proto3";

package snapshotpb.v1;

// Record for the slot ID of the profile.
enum ProfileId {
  PROFILE_ID_UNSPECIFIED = 0;
  PROFILE_ID_ONE = 1;
  PROFILE_ID_TWO = 2;
  PROFILE_ID_THREE = 3;
  PROFILE_ID_FOUR = 4;
}

message Device {
    // The 16 byte UUID device ID
    bytes device_id = 1;

    // Slot ID of the currently active profile (PROFILE_ID_ONE through PROFILE_ID_FOUR).
    ProfileId active_profile = 2;

    // Flag indicating if the board has enabled its lockout. A board in lockout can not be modified
    // until the lockout has been disabled from hardware switch.
    bool lockout_enabled = 3;

    // Text displayed briefly when the board is turned on. Defaults to SnapshotPB. Limit of 10 bytes.
    string boot_text = 4;
}

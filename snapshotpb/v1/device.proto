// Read-only device state reported by the board. Clients consume Device messages
// but never write them; writable settings live in device_config.proto.

syntax = "proto3";

package snapshotpb.v1;

// The board model a physical board is built for. Each value pairs one-to-one with
// an arm of the `board_config` oneof in Profile (profile.proto). When adding a new
// board model, add its `board_config` arm AND a matching value here — keep the two
// in sync. See the README's "adding a board type" example.
enum BoardModel {
  // Unset / unknown board model.
  BOARD_MODEL_UNSPECIFIED = 0;

  // Autococker board — pairs with board_config.autococker (AutocockerConfig).
  BOARD_MODEL_AUTOCOCKER = 1;
}

// Board-owned device state, reported by the board to its clients.
//
// READ-ONLY TO CLIENTS: every field is set by the board; clients only ever read
// a Device and must never send one to change state. App-writable settings live
// in DeviceConfig (device_config.proto), the only device message a client writes.
message Device {
  // The 16 byte UUID device ID
  bytes device_id = 1;

  // Flag indicating if the board has enabled its lockout. A board in lockout can not be modified
  // until the lockout has been disabled from hardware switch.
  bool lockout_enabled = 2;

  // The board model this hardware is built for. The board exclusively supports the
  // matching `board_config` arm — every Profile on this board must set that arm.
  BoardModel model = 3;

  // Number of profile slots this board supports. Profiles are addressed 1-based, so
  // valid DeviceConfig.active_profile values are 1..supported_profile_count. Stored as
  // a uint8 in firmware (see device.options).
  uint32 supported_profile_count = 4;
}

// Wrapper message for the SnapshotPB board configuration protocol.

syntax = "proto3";

package snapshotpb.v1;

import "snapshotpb/v1/device.proto";
import "snapshotpb/v1/profile.proto";

message Message {
    oneof payload {
        Device device = 1;
        Profiles profiles = 2;
        DeviceConfig device_config = 3;
    }
}
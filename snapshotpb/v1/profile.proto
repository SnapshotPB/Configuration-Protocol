// A profile defining a user configuration for the marker

syntax = "proto3";

package snapshotpb.v1;

import "snapshotpb/autococker/v1/autococker.proto";

enum ProfileType {
  // Unset / unknown profile type.
  PROFILE_TYPE_UNSPECIFIED = 0;

  // Simplified profile: the user prefers coarse, default control.
  PROFILE_TYPE_DEFAULT = 1;

  // Custom profile: the user wants fine-grained control over settings.
  PROFILE_TYPE_CUSTOM = 2;
}

// A profile defining a user configuration for the marker
message Profile {
  // Tag 5 held ScreenBrightness screen_brightness. The screen belongs to the BOARD
  // and not to a profile: one screen serves all four slots, so a per-profile value
  // asked the board to hold four answers for one piece of glass, and a profile
  // switch changed the brightness under the user. The setting now lives on
  // DeviceConfig, together with screen_off_delay, and the ScreenBrightness enum
  // moved to device_config.proto with it.
  //
  // A board that reads an old stored profile SKIPS this tag, so the brightness
  // returns to the board default and the rest of the profile is unharmed. A client
  // that still writes tag 5 has that tag ignored. Do not give tag 5 a new meaning:
  // it is a varint, and a new varint field here would silently take the old value.
  reserved 5;
  reserved "screen_brightness";

  // The user's name for this profile. The limit is 9 BYTES, not 9 characters:
  // UTF-8 spends more than one byte on a character outside ASCII, so an accented
  // letter costs two. The firmware holds the name in a char[10] -- profile.options
  // sets max_size:10, and nanopb counts the null terminator inside that size.
  //
  // This is the user's own text, so DeviceConfig.language does not constrain it.
  // The board's font pack decides which characters the board can draw, and the
  // client limits the user's input to the characters that pack holds.
  string name = 1;

  // Identifier for client to understand granularity of control the user prefers
  ProfileType type = 2;

  // A maximum firerate for the marker. Board-specific timing may be artificially adjusted to honor
  // this cap. 0 = uncapped (firmware uses the maximum); otherwise clamped to 1-100 RPS. Factory
  // default is 13 RPS: a fresh/unset profile must be materialized as 13 by BOTH the app and the
  // firmware -- do not rely on the proto3 zero-value, which means uncapped, not the default.
  uint32 fire_rate_cap = 3;

  // The amount of time in minutes for the board to automatically shut off without trigger or button
  // interactions. Range 0-9999 minutes.
  uint32 board_auto_off = 4;

  // Board-model-specific firing configuration. The set arm identifies the board model.
  oneof board_config {
    snapshotpb.autococker.v1.AutocockerConfig autococker = 6;
  }
}

// The collection of user profiles stored on the board (max 4, see profile.options).
message Profiles {
  repeated Profile profiles = 1;
}

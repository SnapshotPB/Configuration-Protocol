// A profile defining a user configuration for the marker

syntax = "proto3";

package snapshotpb.v1;

import "snapshotpb/autococker/v1/autococker.proto";

enum ProfileType {
  // Unset / unknown profile type.
  PROFILE_TYPE_UNSPECIFIED = 0;

  // Simplified profile: the user prefers coarse, default control.
  PROFILE_TYPE_DEFAULT = 1;

  // Custom profile: the user wants fine-grained control over settings.
  PROFILE_TYPE_CUSTOM = 2;
}

enum ScreenBrightness {
  // Unset / unknown brightness.
  SCREEN_BRIGHTNESS_UNSPECIFIED = 0;

  // Minimal brightness, lowest power consumption.
  SCREEN_BRIGHTNESS_LOW = 1;

  // Default brightness
  SCREEN_BRIGHTNESS_DEFAULT = 2;

  // Maximum brightness, highest power consumption.
  SCREEN_BRIGHTNESS_HIGH = 3;
}

// A profile defining a user configuration for the marker
message Profile {
  // Name for the given profile limited to 10 ASCII characters (0-255)
  string name = 1;

  // Identifier for client to understand granularity of control the user prefers
  ProfileType type = 2;

  // A maximum firerate for the marker. Board-specific timing may be artificially adjusted to honor
  // this cap.
  uint32 fire_rate_cap = 3;

  // The amount of time in minutes for the board to automatically shut off without trigger or button
  // interactions.
  uint32 board_auto_off = 4;

  // Device setting for how bright the screen should be.
  ScreenBrightness screen_brightness = 5;

  // Board-model-specific firing configuration. The set arm identifies the board model.
  oneof board_config {
    snapshotpb.autococker.v1.AutocockerConfig autococker = 6;
  }
}

// The collection of user profiles stored on the board (max 4, see profile.options).
message Profiles {
  repeated Profile profiles = 1;
}
